<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="style.css">
     <script src="script.js" defer></script>
    <title>Lista zadań</title>
</head>
<body>
        <header>
            <h1>Lista zadań</h1>
        </header>

    <div class="main">

        <section class="search-section">
            <input type="text" id="search-task" placeholder="Szukaj zadania...">
        </section>

        <section class="task-list">
            <ul id="tasks"></ul>
        </section>

        <section class="task-input">
            <input type="text" id="new-task" placeholder="Dodaj nowe zadanie...">
            <input type="date" id="task-date" placeholder="dd.mm.rrrr">
            <button id="add-task-btn">Dodaj</button>
        </section>
       
    </div>

    <footer>Designed by Aleksandra Czereszkiewicz</footer>

</body>
</html>
